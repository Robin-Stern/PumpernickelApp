description: Recipe-AI prompt evaluation suite

prompts:
  - file://./prompts/recipe-system.json

providers:
  - id: together-gpt-oss-20b
    label: openai/gpt-oss-20b (kostenlos)
    config:
      apiBaseUrl: https://api.together.ai/v1
      apiKeyEnvar: TOGETHER_API_KEY
      model: openai/gpt-oss-20b
      max_tokens: 4096
      temperature: 0.7
      response_format: { type: json_object }
  - id: together-gemma-4-31b
    label: google/gemma-4-31B-it
    config:
      apiBaseUrl: https://api.together.ai/v1
      apiKeyEnvar: TOGETHER_API_KEY
      model: google/gemma-4-31B-it
      max_tokens: 4096
      temperature: 0.7
      response_format: { type: json_object }

defaultTest:
  assert:
    - type: javascript
      value: file://./cases/recipe-validator.js

tests: file://./cases/recipe.json
